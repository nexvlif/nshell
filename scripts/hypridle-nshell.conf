# FALLBACK ONLY — not the official path.
#
# nshell's official idle/suspend story is built in:
#   - idle lock: AutoLock service (Settings > Behavior > Lock after idle),
#     pausable via coffee / game mode (IdleInhibitor + IdleMonitor.respectInhibitors)
#   - suspend lock: SleepLock service (systemd-inhibit delay + logind
#     PrepareForSleep/Lock signals), enabled automatically in shell.qml
#
# Only use this file if SleepLock misbehaves on your system (missing
# systemd-inhibit/dbus-monitor, exotic init, etc). Copy the relevant lines
# into your hypridle.conf and replace <nshell-dir> with your checkout path.
#
# hypridle's `before_sleep_cmd` runs before sleep; `lock_cmd` runs on
# `loginctl lock-session`.

# general {
#     lock_cmd = qs -p <nshell-dir>/shell.qml ipc call nshell lock
#     before_sleep_cmd = qs -p <nshell-dir>/shell.qml ipc call nshell lock
#     after_sleep_cmd = hyprctl dispatch dpms on
# }
#
# listener {
#     timeout = 600
#     on-timeout = qs -p <nshell-dir>/shell.qml ipc call nshell lock
# }
